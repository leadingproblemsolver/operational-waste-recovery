repo:
  name: operational-waste-recovery
  version: 1.0.0
  status: release_candidate
  classification: local_first_telemetry_analysis
product:
  user: engineering, AI-platform, FinOps, and developer-productivity operators
  function: imported AI and engineering telemetry to duplicate-work evidence and reusable context capsules
  primary_input: canonical, OpenAI-style, or mapped generic JSONL
  primary_output: SQLite ledger, reports, query results, context capsules, JSON/CSV export, read-only API
integration:
  surfaces: [python_cli, python_wheel, jsonl, sqlite, json, csv, read_only_http]
  credentials_required_for_local_cli: false
  token_required_for_non_loopback_api: true
privacy:
  secret_like_content_rejected_by_default: true
  optional_pre_storage_redaction: true
  explicit_retention_purge: true
verified_offline:
  - adapter and event contract validation
  - atomic idempotent ingestion
  - duplicate analysis and context capsules
  - privacy rejection/redaction and scoped purge
  - query, report, export, and API contracts
unverified_external:
  - provider-field compatibility against live exports
  - realized labor or cost savings
  - production scale and organizational adoption
