name: all-things-agentic-live-receipt

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/all-things-agentic-live.yml'

permissions:
  contents: write
  id-token: write

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: signalops-506419
      RUN_REGION: me-central1
      MODEL_LOCATION: global
      SERVICE: recovery-taskmaster
      PROOF_RUN_ID: judge-demo-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v7

      - name: Prepare proof directory
        shell: bash
        run: |
          mkdir -p artifacts/google-live
          printf '%s\n' prepared > artifacts/google-live/phase.txt

      - id: auth
        name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/625265193189/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: recovery-taskmaster-deployer@signalops-506419.iam.gserviceaccount.com
          project_id: signalops-506419

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: signalops-506419

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify intended project and identity
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = 'signalops-506419' || (echo 'BLOCKED: this proof workflow is bound to signalops-506419' && exit 1)
          ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
          test "$ACCOUNT" = 'recovery-taskmaster-deployer@signalops-506419.iam.gserviceaccount.com' || (echo "BLOCKED: unexpected active identity: $ACCOUNT" && exit 1)
          echo "PASS: keyless GitHub OIDC authenticated as $ACCOUNT"
          printf '%s\n' authenticated > artifacts/google-live/phase.txt

      - name: Install Google Agents CLI
        run: python -m pip install google-agents-cli

      - name: Verify required Google Cloud APIs are pre-enabled
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED=(
            run.googleapis.com
            cloudbuild.googleapis.com
            artifactregistry.googleapis.com
            aiplatform.googleapis.com
          )
          ENABLED="$(gcloud services list --enabled --project "$PROJECT_ID" --format='value(config.name)')"
          missing=0
          for api in "${REQUIRED[@]}"; do
            if grep -qx "$api" <<<"$ENABLED"; then
              echo "PASS: $api enabled"
            else
              echo "BLOCKED: $api is not enabled. Enable it once with a project owner/admin identity before rerunning."
              missing=1
            fi
          done
          test "$missing" -eq 0
          printf '%s\n' apis_ready > artifacts/google-live/phase.txt

      - name: Deploy exact Taskmaster source to Cloud Run
        working-directory: hackathons/all-things-agentic/recovery-taskmaster
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SA='recovery-taskmaster-deployer@signalops-506419.iam.gserviceaccount.com'
          echo "Runtime service account: $RUNTIME_SA"

          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$RUN_REGION" \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SA" \
            --set-env-vars "GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=$MODEL_LOCATION,RECOVERY_TASKMASTER_ROOT=/tmp/recovery-taskmaster"

          printf '%s\n' deployed > "$GITHUB_WORKSPACE/artifacts/google-live/phase.txt"

      - name: Capture Cloud Run deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$RUN_REGION" \
            --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$RUN_REGION" \
            --format='value(status.latestReadyRevisionName)')"
          test -n "$URL"
          test -n "$REVISION"
          printf '%s\n' "$URL" | tee artifacts/google-live/cloud-run-url.txt
          printf '%s\n' "$REVISION" | tee artifacts/google-live/cloud-run-revision.txt
          gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$RUN_REGION" \
            --format=json > artifacts/google-live/cloud-run-service.json
          printf '%s\n' deployment_receipt_captured > artifacts/google-live/phase.txt

      - name: Advisory health probe
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat artifacts/google-live/cloud-run-url.txt)"
          set +e
          STATUS="$(curl --silent --show-error --output artifacts/google-live/healthz-body.txt --write-out '%{http_code}' "$URL/healthz")"
          CURL_RC=$?
          set -e
          printf '%s\n' "$STATUS" > artifacts/google-live/healthz-status.txt
          printf '%s\n' "$CURL_RC" > artifacts/google-live/healthz-curl-exit.txt
          if [ "$CURL_RC" -eq 0 ] && [ "$STATUS" = '200' ]; then
            echo 'PASS: optional /healthz probe returned 200'
          else
            echo "ADVISORY: /healthz probe returned HTTP $STATUS (curl exit $CURL_RC); continuing because the rubric proof is the deployed agent execution itself."
          fi

      - name: Run deployed Gemini + ADK workflow to VERIFIED
        shell: bash
        run: |
          set -euo pipefail
          URL="$(cat artifacts/google-live/cloud-run-url.txt)"
          PROMPT="Complete a recovery workflow for run_id $PROOF_RUN_ID. Do the work end to end and stop only at VERIFIED or an explicit blocked state."

          agents-cli run \
            --url "$URL" \
            --mode adk \
            --app-name recovery_taskmaster \
            --verbose \
            "$PROMPT" \
            | tee artifacts/google-live/live-agent-trace.txt

          grep -q 'VERIFIED' artifacts/google-live/live-agent-trace.txt
          printf '%s\n' verified > artifacts/google-live/phase.txt

      - name: Capture Cloud Run execution logs
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/google-live
          if command -v gcloud >/dev/null 2>&1; then
            gcloud logging read \
              "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\"" \
              --project "$PROJECT_ID" \
              --limit 100 \
              --freshness 30m \
              --format=json > artifacts/google-live/cloud-run-logs.json || printf '%s\n' '[]' > artifacts/google-live/cloud-run-logs.json
          else
            printf '%s\n' '[]' > artifacts/google-live/cloud-run-logs.json
          fi

      - name: Write bounded receipt index
        if: always()
        shell: bash
        env:
          WORKFLOW_STATUS: ${{ job.status }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('artifacts/google-live')
          root.mkdir(parents=True, exist_ok=True)

          def read_text(name):
              path = root / name
              return path.read_text(errors='replace').strip() if path.exists() else None

          url = read_text('cloud-run-url.txt')
          revision = read_text('cloud-run-revision.txt')
          trace = read_text('live-agent-trace.txt') or ''
          phase = read_text('phase.txt') or 'unknown'
          health_status = read_text('healthz-status.txt')
          health_body = read_text('healthz-body.txt')
          proof_run_id = os.environ['PROOF_RUN_ID']
          workflow_status = os.environ.get('WORKFLOW_STATUS', 'unknown')
          verified = 'VERIFIED' in trace

          receipt = {
              'receipt_version': 3,
              'proof_status': 'VERIFIED' if workflow_status == 'success' and verified else 'INCOMPLETE',
              'workflow_status': workflow_status,
              'last_completed_phase': phase,
              'event_name': os.environ.get('EVENT_NAME'),
              'github_workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'github_workflow_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'source_commit_sha': os.environ.get('GITHUB_SHA'),
              'project_id': os.environ['PROJECT_ID'],
              'cloud_run_region': os.environ['RUN_REGION'],
              'model_location': os.environ['MODEL_LOCATION'],
              'model': 'gemini-3.5-flash',
              'service': os.environ['SERVICE'],
              'run_id': proof_run_id,
              'cloud_run_url': url,
              'cloud_run_revision': revision,
              'health_probe': {
                  'status_code': health_status,
                  'body': health_body,
                  'required_for_proof': False,
              },
              'verified_terminal_observed': verified,
              'authentication': 'GitHub OIDC -> Google Workload Identity Federation -> service account impersonation',
              'execution_contract': 'persisted evidence -> host-enforced state -> bounded action -> reconcile/reread -> verified settlement',
              'claim_boundary': {
                  'proves_when_verified': [
                      'the source commit was deployed to Google Cloud Run',
                      'the exact Cloud Run public URL and ready revision were captured',
                      'a remote Gemini 3.5 / ADK workflow was invoked against the deployed service',
                      'the captured live trace contained a VERIFIED terminal state',
                  ],
                  'does_not_prove': [
                      'customer adoption',
                      'realized financial savings',
                      'production scale',
                      'multi-instance durable persistence',
                      'settlement for non-queryable external side effects',
                  ],
              },
          }
          (root / 'receipt-index.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload Google Cloud live receipt pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskmaster-google-live-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/google-live/
          if-no-files-found: error

      - name: Publish sanitized live status branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/google-live/receipt-index.json
          cp artifacts/google-live/receipt-index.json /tmp/taskmaster-google-live-latest.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C proof/taskmaster-google-live-status
          mkdir -p proof
          cp /tmp/taskmaster-google-live-latest.json proof/taskmaster-google-live-latest.json
          git add -- proof/taskmaster-google-live-latest.json
          git commit -m 'proof: publish Taskmaster Google live status'
          git push --force origin HEAD:refs/heads/proof/taskmaster-google-live-status
