name: docker-runtime

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docker-runtime:
    runs-on: ubuntu-latest
    env:
      OWRP_API_TOKEN: owrp-ci-test-token
    steps:
      - uses: actions/checkout@v4

      - name: Prepare writable bind mounts
        run: |
          mkdir -p data reports logs runtime-receipts
          chmod a+rwx data reports logs runtime-receipts

      - name: Build and start Compose service
        run: docker compose up --build -d

      - name: Wait for liveness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health > runtime-receipts/health-initial.json; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Verify authentication boundary
        run: |
          code=$(curl --silent --output runtime-receipts/status-unauthorized.json --write-out '%{http_code}' \
            http://127.0.0.1:8787/api/status)
          test "$code" = "401"
          curl --fail --silent \
            -H "Authorization: Bearer $OWRP_API_TOKEN" \
            http://127.0.0.1:8787/api/status \
            > runtime-receipts/status-empty.json

      - name: Exercise ingest analyze report export path
        run: |
          docker compose exec -T operational-waste-recovery \
            owrp --root /app ingest --input /app/data/sample_events.jsonl
          docker compose exec -T operational-waste-recovery \
            owrp --root /app status > runtime-receipts/cli-status.txt
          docker compose exec -T operational-waste-recovery \
            owrp --root /app analyze > runtime-receipts/cli-analyze.txt
          docker compose exec -T operational-waste-recovery \
            owrp --root /app report > runtime-receipts/cli-report.txt
          docker compose exec -T operational-waste-recovery \
            owrp --root /app export --format json --output /app/reports/interactions.json \
            > runtime-receipts/cli-export.txt

      - name: Capture persisted state before restart
        run: |
          curl --fail --silent \
            -H "Authorization: Bearer $OWRP_API_TOKEN" \
            http://127.0.0.1:8787/api/status \
            > runtime-receipts/status-before-restart.json
          test -s reports/interactions.json

      - name: Restart service and wait for liveness
        run: |
          docker compose restart operational-waste-recovery
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health > runtime-receipts/health-after-restart.json; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Verify state survived restart
        run: |
          curl --fail --silent \
            -H "Authorization: Bearer $OWRP_API_TOKEN" \
            http://127.0.0.1:8787/api/status \
            > runtime-receipts/status-after-restart.json
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('runtime-receipts/status-before-restart.json').read_text())
          after = json.loads(Path('runtime-receipts/status-after-restart.json').read_text())
          assert before == after, {'before': before, 'after': after}
          assert before['interactions'] > 0, before
          assert before['duplicate_pairs'] > 0, before
          assert before['context_capsules'] > 0, before
          PY

      - name: Verify read API after restart
        run: |
          curl --fail --silent \
            -H "Authorization: Bearer $OWRP_API_TOKEN" \
            http://127.0.0.1:8787/api/repositories \
            > runtime-receipts/repositories-after-restart.json
          curl --fail --silent \
            -H "Authorization: Bearer $OWRP_API_TOKEN" \
            'http://127.0.0.1:8787/api/query?q=redis%20timeout&limit=8' \
            > runtime-receipts/query-after-restart.json

      - name: Capture Compose state
        if: always()
        run: |
          docker compose ps > runtime-receipts/compose-ps.txt || true
          docker compose logs --no-color > runtime-receipts/compose.log 2>&1 || true

      - name: Upload runtime receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-runtime-receipts
          path: |
            runtime-receipts/
            reports/interactions.json
          if-no-files-found: error

      - name: Stop Compose service
        if: always()
        run: docker compose down
