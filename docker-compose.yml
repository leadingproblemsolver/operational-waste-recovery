services:
  operational-waste-recovery:
    build: .
    ports: ["8787:8787"]
    environment:
      OWRP_API_TOKEN: ${OWRP_API_TOKEN:?set OWRP_API_TOKEN}
      OWRP_CORS_ORIGIN: ${OWRP_CORS_ORIGIN:-}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    restart: unless-stopped
